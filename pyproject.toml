[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "award-scanner"
version = "0.1.0"
description = "CLI for evaluating award-flight redemptions using CPP."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.0",
]

[project.scripts]
award-scan = "cli:scan"

[tool.setuptools]
py-modules = ["cli", "scanner"]